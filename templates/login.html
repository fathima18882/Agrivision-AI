<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url("{{ url_for('static', filename='images/bg.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
        }

        /* DARK OVERLAY */
        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* CENTER CONTAINER */
        .center-box {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* GLASS CARD */
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 15px;

            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);

            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

<!-- OVERLAY -->
<div class="overlay"></div>

<div class="center-box">

    <div class="login-card text-center">

        <h3>🔐 Login</h3>
        <p class="text-muted">AI Land Classification System</p>

        <form method="POST" action="/login">

            <input type="text" name="username" class="form-control mt-3" placeholder="Username" required>

            <input type="password" name="password" class="form-control mt-3" placeholder="Password" required>

            <button class="btn btn-primary w-100 mt-3">Login</button>

        </form>

    </div>

</div>

</body>
</html>
